name: Build LaTeX Document

on:
  push:
    branches:
      - main
    paths:
      - 'Document/**'
  pull_request:
    branches:
      - main
    paths:
      - 'Document/**'

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: Document/conference_101719.tex
          working_directory: Document
          
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF
          path: Document/conference_101719.pdf
          
      - name: Commit PDF back to repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add Document/conference_101719.pdf
          # Only commit if the PDF actually changed
          git diff --staged --quiet || git commit -m "Auto-compile LaTeX document [skip ci]"
          git push
