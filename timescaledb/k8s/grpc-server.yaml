apiVersion: apps/v1
kind: Deployment
metadata:
  name: grpc-server
  namespace: iot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: grpc-server
  template:
    metadata:
      labels:
        app: grpc-server
    spec:
      containers:
        - name: grpc-server
          image: us-central1-docker.pkg.dev/project-4a8f3b06-8ff8-4efd-a4d/mqtt-broker/grpc-server:latest
          ports:
            - containerPort: 50051
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: timescaledb-secret
                  key: password
            - name: DATABASE_URL
              value: postgres://postgres:$(DB_PASSWORD)@timescaledb-operator-rw.iot.svc.cluster.local:5432/temperatures?sslmode=disable
            - name: GCP_PROJECT
              value: project-4a8f3b06-8ff8-4efd-a4d
            - name: PUBSUB_SUBSCRIPTION
              value: mqtt-broker-subscription
            - name: GRPC_PORT
              value: "50051"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: grpc-server
  namespace: iot
spec:
  selector:
    app: grpc-server
  ports:
    - port: 50051
      targetPort: 50051
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: grpc-server
  namespace: iot
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: grpc-server
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
