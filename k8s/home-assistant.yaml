apiVersion: v1
kind: Namespace
metadata:
  name: iot-gateway
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: home-assistant-pvc
  namespace: iot-gateway
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: iot-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      labels:
        app: home-assistant
    spec:
      containers:
      - name: home-assistant
        image: ghcr.io/home-assistant/home-assistant:stable
        ports:
        - containerPort: 8123
        volumeMounts:
        - name: config-volume
          mountPath: /config
      volumes:
      - name: config-volume
        persistentVolumeClaim:
          claimName: home-assistant-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: home-assistant-svc
  namespace: iot-gateway
spec:
  type: ClusterIP
  ports:
  - port: 8123
    targetPort: 8123
  selector:
    app: home-assistant